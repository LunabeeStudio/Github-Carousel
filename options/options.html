<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PR Screenshot Carousel options</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; } }
    body { margin: 0; padding: 16px 20px; min-width: 320px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    form { display: grid; gap: 16px; }
    fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
    legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
    label { display: flex; align-items: flex-start; gap: 8px; }
    .hint { color: var(--muted); font-size: 12px; margin: 2px 0 0 24px; }
    .status { color: var(--muted); font-size: 12px; min-height: 1.5em; margin: 0; }
  </style>
</head>
<body>
  <form id="form">
    <fieldset>
      <legend>One slide shows</legend>
      <label><input type="radio" name="mode" value="row"> One table row, side by side</label>
      <label><input type="radio" name="mode" value="single"> One image</label>
    </fieldset>
    <fieldset>
      <legend>Zoom</legend>
      <label><input type="checkbox" name="sync"> Sync zoom across columns</label>
      <p class="hint">Zoom and pan move Before and After together.</p>
      <label><input type="checkbox" name="keep"> Keep zoom when changing slide</label>
      <p class="hint">Off resets every slide to fit.</p>
    </fieldset>
    <p class="status" id="status" aria-live="polite"></p>
  </form>
  <script src="../src/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
